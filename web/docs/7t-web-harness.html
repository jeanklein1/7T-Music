<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>7T · web harness</title>
<style>
  /* ---------------------------------------------------------------
     Two-tier tokens, same shape as the site plan.
     Re-theme by editing the palette tier only; the shader reads
     these live (see PALETTE in JS), so a new painting = new values,
     nothing hardcoded downstream.
  --------------------------------------------------------------- */
  :root {
    /* palette tier — literal hues (from the oil) */
    --sand:      #EFE6D4;
    --bone:      #E1D3B6;
    --ink:       #211E1C;
    --ink-soft:  #5A554C;
    --sky:       #6E9BC0;
    --coral:     #DC987B;
    --gold:      #E0A24E;
    --olive:     #9DA177;
    --lavender:  #A29EAF;
    --orb-red:   #C0532F;   /* rationed punctuation */

    /* semantic tier — roles */
    --bg:     var(--ink);
    --fg:     var(--sand);
    --muted:  var(--ink-soft);
    --accent: var(--orb-red);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.02em; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  #status { position: fixed; left: 22px; top: 20px; z-index: 10; color: var(--muted);
    white-space: pre; pointer-events: none; }
  #ui { position: fixed; left: 22px; bottom: 22px; z-index: 10; }
  button { background: transparent; color: var(--fg);
    border: 1px solid var(--muted); border-radius: 0;
    padding: 11px 18px; font: inherit; letter-spacing: 0.06em;
    cursor: pointer; transition: color .15s, border-color .15s; }
  button:hover, button:focus-visible { color: var(--accent); border-color: var(--accent);
    outline: none; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="status">booting…</div>
  <div id="ui"><button id="start">▶ start drone</button></div>

<script type="module">
/* ============================================================================
   7T WEB HARNESS
   Purpose: prove the browser pipeline end to end, so the port is de-risked
   before a single line of the real visualizer moves.

     synth drone ──▶ Web Audio AnalyserNode ──▶ bands + RMS
                                                    │
                                            (uniform buffer)
                                                    ▼
                         compute pass  ──rewrites──▶ storage buffer (agents)
                                                    │
                                              render pass reads it ──▶ canvas

   The placeholder visual is a deliberately dumb agent field in your palette.
   It exists only to show the plumbing is live. Swap in the 7T WGSL at the two
   marked seams and delete the placeholder dynamics.
   ========================================================================== */

const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start');
const canvas   = document.getElementById('stage');
const log = (m) => { statusEl.textContent = m; };

if (!('gpu' in navigator)) {
  log('WebGPU not available here.\nOpen this file in Chrome or Edge, over http(s) or localhost.\n(If you see this inside a preview pane, that is just the sandbox — it runs in the browser.)');
  throw new Error('no webgpu');
}

/* --- palette tier → JS (so the shader can read live theme colours) --------- */
const css = getComputedStyle(document.documentElement);
const hex = (name) => {
  const h = css.getPropertyValue(name).trim().replace('#','');
  return [parseInt(h.slice(0,2),16)/255, parseInt(h.slice(2,4),16)/255, parseInt(h.slice(4,6),16)/255];
};
const PALETTE = {
  ink:  hex('--ink'),
  sky:  hex('--sky'),
  gold: hex('--gold'),
  orb:  hex('--orb-red'),
};

/* --- device + surface ------------------------------------------------------ */
const adapter = await navigator.gpu.requestAdapter();
if (!adapter) { log('No GPU adapter.'); throw new Error('no adapter'); }

/* Storage-buffers-per-stage: spec floor is 8, your desktop Dawn exposes 10.
   On Chrome/Dawn you can simply ask for it back. For a public build that must
   run everywhere, coalesce down to <=8 instead of relying on this. */
const WANT_STORAGE = 10;
const adapterMax   = adapter.limits.maxStorageBuffersPerShaderStage;
const requiredLimits = {};
if (adapterMax >= WANT_STORAGE) requiredLimits.maxStorageBuffersPerShaderStage = WANT_STORAGE;

const device = await adapter.requestDevice({ requiredLimits });
device.lost.then((info) => log('Device lost: ' + info.message));

const ctx    = canvas.getContext('webgpu');
const format = navigator.gpu.getPreferredCanvasFormat();
ctx.configure({ device, format, alphaMode: 'opaque' });

log(
  'webgpu ok\n' +
  'storage buffers / stage — adapter: ' + adapterMax +
  '  device: ' + device.limits.maxStorageBuffersPerShaderStage + '\n' +
  'press “start drone”.'
);

/* --- resize (DPR-clamped) -------------------------------------------------- */
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(canvas.clientWidth  * dpr));
  const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}
window.addEventListener('resize', resize);
resize();

/* --- agents in a storage buffer -------------------------------------------
   struct P { angle, radius, speed, seed } → 4 × f32 = 16 bytes.
   This is the buffer the compute pass mutates and the render pass reads —
   i.e. the exact shape your entity families will take.                        */
const N = 6000;
const agentData = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  agentData[i*4+0] = Math.random() * Math.PI * 2;                       // angle
  agentData[i*4+1] = 0.14 + Math.sqrt(Math.random()) * 0.86;            // radius 0.14..1.0
  agentData[i*4+2] = (0.2 + Math.random() * 0.6) * (Math.random() < 0.5 ? -1 : 1); // speed ±
  agentData[i*4+3] = Math.random();                                     // seed
}
const agentBuf = device.createBuffer({
  size: agentData.byteLength,
  usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  mappedAtCreation: true,
});
new Float32Array(agentBuf.getMappedRange()).set(agentData);
agentBuf.unmap();

/* --- uniforms: audio + time + theme ---------------------------------------
   layout (std140-friendly): 8 scalars, then 4 vec4f colours = 96 bytes.       */
const U_FLOATS = 24;                 // 8 + 4*4
const uData = new Float32Array(U_FLOATS);
const uBuf  = device.createBuffer({ size: uData.byteLength, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
// static colours (offsets in floats: 8,12,16,20)
uData.set([...PALETTE.orb,  1], 8);   // colA — accent
uData.set([...PALETTE.sky,  1], 12);  // colB
uData.set([...PALETTE.gold, 1], 16);  // colC
uData.set([...PALETTE.ink,  1], 20);  // colBg

/* --- shared WGSL header ---------------------------------------------------- */
const COMMON = /* wgsl */`
struct U {
  time: f32, dt: f32, rms: f32, bass: f32,
  mid: f32, treble: f32, aspect: f32, count: f32,
  colA: vec4f, colB: vec4f, colC: vec4f, colBg: vec4f,
};
struct P { angle: f32, radius: f32, speed: f32, seed: f32 };
`;

/* ======================= SEAM 1 — COMPUTE ==================================
   Replace the body of cs() with your 7T update. Keep the signature and the
   storage binding; everything upstream (audio → uniforms) already feeds it.  */
const computeWGSL = COMMON + /* wgsl */`
@group(0) @binding(0) var<uniform> u : U;
@group(0) @binding(1) var<storage, read_write> agents : array<P>;

@compute @workgroup_size(64)
fn cs(@builtin(global_invocation_id) gid: vec3u) {
  let i = gid.x;
  if (i >= u32(u.count)) { return; }
  var p = agents[i];
  // placeholder: treble spins the field, mid gives a base drift
  p.angle = p.angle + (p.speed * (0.3 + u.treble * 2.0) + u.mid * 0.6) * u.dt;
  agents[i] = p;
}
`;

/* ======================= SEAM 2 — RENDER ===================================
   Replace vs()/fs() with your draw. Storage is bound read-only here (vertex &
   fragment cannot write storage in core WebGPU — only compute can).          */
const renderWGSL = COMMON + /* wgsl */`
@group(0) @binding(0) var<uniform> u : U;
@group(0) @binding(1) var<storage, read> agents : array<P>;

struct VSOut {
  @builtin(position) pos: vec4f,
  @location(0) uv: vec2f,
  @location(1) col: vec3f,
};

@vertex
fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VSOut {
  // one instanced quad per agent, corners generated in-shader
  var corners = array<vec2f, 6>(
    vec2f(-1., -1.), vec2f(1., -1.), vec2f(1., 1.),
    vec2f(-1., -1.), vec2f(1.,  1.), vec2f(-1., 1.)
  );
  let p = agents[ii];
  let R      = p.radius * (0.55 + u.bass * 0.9);            // bass blooms the ring
  let center = vec2f(cos(p.angle), sin(p.angle)) * R;
  let size   = (0.0035 + u.rms * 0.02) * (0.5 + p.seed * 0.9);
  let corner = corners[vi];

  var world = center + corner * size;
  world.x = world.x / max(u.aspect, 0.0001);               // keep dots round

  var out: VSOut;
  out.pos = vec4f(world, 0., 1.);
  out.uv  = corner;

  let t = fract(p.seed + u.mid * 0.5);
  var c = mix(u.colB.rgb, u.colC.rgb, t);                   // sky → gold
  c = mix(c, u.colA.rgb, smoothstep(0.55, 1.0, u.bass));    // punch to orb-red on bass
  out.col = c * (0.45 + u.rms * 1.6);
  return out;
}

@fragment
fn fs(in: VSOut) -> @location(0) vec4f {
  let d = length(in.uv);
  let a = smoothstep(1.0, 0.0, d);                          // soft round point
  if (a <= 0.001) { discard; }
  return vec4f(in.col * a, a);
}
`;

/* --- pipelines (auto layout keeps the harness short) ----------------------- */
const computePipeline = device.createComputePipeline({
  layout: 'auto',
  compute: { module: device.createShaderModule({ code: computeWGSL }), entryPoint: 'cs' },
});
const renderModule = device.createShaderModule({ code: renderWGSL });
const renderPipeline = device.createRenderPipeline({
  layout: 'auto',
  vertex:   { module: renderModule, entryPoint: 'vs' },
  fragment: { module: renderModule, entryPoint: 'fs', targets: [{
    format,
    blend: {                                                // additive glow on ink
      color: { srcFactor: 'src-alpha', dstFactor: 'one', operation: 'add' },
      alpha: { srcFactor: 'one',       dstFactor: 'one', operation: 'add' },
    },
  }]},
  primitive: { topology: 'triangle-list' },
});

const computeBind = device.createBindGroup({
  layout: computePipeline.getBindGroupLayout(0),
  entries: [{ binding: 0, resource: { buffer: uBuf } }, { binding: 1, resource: { buffer: agentBuf } }],
});
const renderBind = device.createBindGroup({
  layout: renderPipeline.getBindGroupLayout(0),
  entries: [{ binding: 0, resource: { buffer: uBuf } }, { binding: 1, resource: { buffer: agentBuf } }],
});

/* --- audio: synthesized drone → analyser ----------------------------------
   Detuned oscillators through a slowly-swept low-pass. The sweep moves energy
   across the bands over time, so the field breathes without any interaction.
   This is the AnalyserNode standing in for the MIDI/Ableton pipeline.         */
let audioCtx, analyser, freqData, started = false;

function startAudio() {
  if (started) return; started = true;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  const master = audioCtx.createGain(); master.gain.value = 0.16;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass'; filter.frequency.value = 700; filter.Q.value = 4;

  const base  = 55; // A1
  const parts = [
    { f: base,        type: 'sawtooth' },
    { f: base * 1.5,  type: 'sine'     },
    { f: base * 2,    type: 'sawtooth' },
    { f: base * 2.5,  type: 'sine'     },
    { f: base * 3.02, type: 'triangle' },
  ];
  for (const part of parts) {
    const o = audioCtx.createOscillator();
    o.type = part.type;
    o.frequency.value = part.f * (1 + (Math.random() - 0.5) * 0.01); // gentle detune
    const g = audioCtx.createGain(); g.gain.value = 0.6 / parts.length;
    o.connect(g).connect(filter); o.start();
  }
  // two LFOs on cutoff — one slow swell, one shimmer
  for (const lfo of [{ r: 0.06, d: 520 }, { r: 0.23, d: 220 }]) {
    const osc = audioCtx.createOscillator(); osc.frequency.value = lfo.r;
    const amt = audioCtx.createGain(); amt.gain.value = lfo.d;
    osc.connect(amt).connect(filter.frequency); osc.start();
  }

  filter.connect(master).connect(audioCtx.destination);

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.8;
  filter.connect(analyser);                 // tap post-filter
  freqData = new Uint8Array(analyser.frequencyBinCount);

  startBtn.textContent = '♪ drone running';
  startBtn.disabled = true;
}
startBtn.addEventListener('click', () => {
  startAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
});

function readBands() {
  if (!analyser) return { rms: 0, bass: 0, mid: 0, treble: 0 };
  analyser.getByteFrequencyData(freqData);
  const n = freqData.length;
  const bassEnd = Math.floor(n * 0.08);
  const midEnd  = Math.floor(n * 0.40);
  let sum = 0, bass = 0, mid = 0, treble = 0;
  for (let i = 0; i < n; i++) {
    const v = freqData[i] / 255;
    sum += v * v;
    if (i < bassEnd) bass += v; else if (i < midEnd) mid += v; else treble += v;
  }
  return {
    rms:    Math.sqrt(sum / n),
    bass:   bass   / bassEnd,
    mid:    mid    / (midEnd - bassEnd),
    treble: treble / (n - midEnd),
  };
}

/* --- frame ----------------------------------------------------------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  resize();
  if (canvas.width === 0 || canvas.height === 0) { requestAnimationFrame(frame); return; }

  const b = readBands();
  uData[0] = now / 1000;
  uData[1] = dt;
  uData[2] = b.rms;
  uData[3] = b.bass;
  uData[4] = b.mid;
  uData[5] = b.treble;
  uData[6] = canvas.width / Math.max(canvas.height, 1);
  uData[7] = N;
  device.queue.writeBuffer(uBuf, 0, uData);

  const enc = device.createCommandEncoder();

  const cpass = enc.beginComputePass();
  cpass.setPipeline(computePipeline);
  cpass.setBindGroup(0, computeBind);
  cpass.dispatchWorkgroups(Math.ceil(N / 64));
  cpass.end();

  const rpass = enc.beginRenderPass({
    colorAttachments: [{
      view: ctx.getCurrentTexture().createView(),
      clearValue: { r: PALETTE.ink[0], g: PALETTE.ink[1], b: PALETTE.ink[2], a: 1 },
      loadOp: 'clear', storeOp: 'store',
    }],
  });
  rpass.setPipeline(renderPipeline);
  rpass.setBindGroup(0, renderBind);
  rpass.draw(6, N, 0, 0);   // 6 verts × N instances
  rpass.end();

  device.queue.submit([enc.finish()]);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
