<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- SHIP_0 U3 — mobile correctness (not optimization). viewport-fit=cover
       so the canvas reaches under the notch; user-scalable=no so a
       two-finger gesture belongs to the piece, not to the browser. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0c">
  <title>the_board</title>
  <style>
    /* ── THE PAGE ──────────────────────────────────────────────────
       Dark, one canvas, three states over it. No framework, no CSS
       files. TWO external assets since POSTER_0, both posters, and
       NEITHER IS LOAD-BEARING: each is a child of a .poster box that
       keeps its own gradient underneath, so a 404, an offline visitor
       or a blocked image leaves this page exactly as it was before.
       The FALLBACK still renders on a device that never gets to run
       anything, which is the property this line has always protected. */
    :root {
      --ink:   #e8e6e0;
      --dim:   #8a8792;
      --faint: #55525c;
      --bg:    #0a0a0c;
      /* --app-h is maintained from visualViewport where available; the
         100% fallback is correct everywhere else. */
      --app-h: 100%;
    }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--ink);
      overflow: hidden; overscroll-behavior: none;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* ── THE FRAME (FRAME_0) ──────────────────────────────────────
       THE CANVAS IS NOT SIZED HERE, AND THE OLD COMMENT THAT SAID IT
       WAS DESCRIBED AN INTENT THE LIBRARY WAS NEVER ASKED TO HONOR.
       contrib.glfw3 writes width/height as INLINE styles on the canvas
       element every time it sets a size (lib_emscripten_glfw3.js,
       emglfw3w_set_size: "this will (on purpose) override any css
       setting"). It asks for !important and does not get it — the call
       passes a third argument to ctx.setCSSValue, which is a
       two-parameter arrow, so the priority is dropped and the
       declaration lands plain. It does not matter: a plain inline
       declaration already outranks a non-important author rule by
       cascade order, so a `#canvas { width: 100% }` here never applied
       at all: the canvas stayed pinned at glfwCreateWindow's size,
       glfwGetFramebufferSize never changed, and console.hpp's
       per-frame reconfigure — real,
       correct, PORT_3c-capped — was simply never fed. That is one
       defect wearing three faces: a phone canvas that ignores both
       orientations, and an F11 that grows the browser but not the world.

       THIS DIV is the fix's other half. console.hpp calls
       emscripten_glfw_make_canvas_resizable(window, "#frame", nullptr),
       which puts a ResizeObserver on it; the library then sizes the
       canvas from THIS element's computed size. So the chain is:

         #frame  <- CSS, from --app-h (visualViewport, unchanged)
         canvas  <- the library, from #frame
         backing <- the library, canvas x devicePixelRatio
         surface <- console.hpp's begin_frame compare, PORT_3c-capped

       Every link is now present. The canvas keeps only what is NOT
       size: display, and the gesture suppression SHIP_1 depends on. */
    #frame {
      position: fixed; inset: 0;
      width: 100%; height: var(--app-h);
      /* The canvas is an in-flow child now, and it carries the
         library's inline size. Between glfwCreateWindow (1280x720) and
         the first glfwPollEvents that applies the container size, it is
         bigger than this box on any phone. Clipped here rather than
         left to the body. */
      overflow: hidden;
      /* The library measures this box with parseInt and TRUNCATES, while
         --app-h comes from a routinely fractional visualViewport.height —
         so the canvas can sit up to a pixel short of the frame. That
         strip is #frame, not #canvas, and would otherwise be the one
         place on screen without the piece's gesture suppression. */
      touch-action: none;
    }
    #canvas {
      display: block; outline: none;
      touch-action: none;                 /* no scroll/zoom hijacking the piece */
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── OVERLAY SKELETON, shared by all three states ─────────────── */
    .layer {
      position: fixed; inset: 0; height: var(--app-h);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 22px; padding: 32px 24px;
      box-sizing: border-box; text-align: center;
      background: var(--bg);
      z-index: 10;
      /* The same suppression the canvas has, for the same reason — and
         FRAME_0 is what made it matter. sizeToViewport writes --app-h on
         visualViewport 'scroll' too, and an iOS pinch-zoom moves that
         continuously. Before FRAME_0 those writes reached nothing; now
         each one resizes #frame, the canvas, the framebuffer, and costs
         a surface Configure plus a fresh depth texture. The veil covers
         the whole screen for the entire boot, so without this the boot
         is pinch-zoomable and every pixel of it is a GPU reallocation. */
      touch-action: none;
    }
    .layer[hidden] { display: none; }
    #veil.lifting { opacity: 0; pointer-events: none; transition: opacity 900ms ease; }

    /* THE POSTER SLOT — Jean's aesthetic gate, filled (POSTER_0).
       2:3 BECAUSE THE PAINTINGS ARE PORTRAIT. At 1:1 the cover crop
       took 17% off each of PAINTING_50's top and bottom edges and 21%
       off PAINTING_200's, and on the second that is the column's
       capital and the arch bands — the composition's spine. At 2:3 the
       trim is 1% and 6%, and it falls sideways, where both paintings
       carry only background. That is why there is no object-position
       here: at 6% centred there is nothing left to steer.
       34vh CAPS THE WIDTH, and at 2:3 that is 51vh of height — near
       half the viewport in either orientation. Read it as a height cap
       and it lies by half: the box was square when this clamp lived in
       a breakpoint, so width and height were one number there, and they
       are two numbers now. Short viewports keep their own tighter term
       for exactly that reason — see SHORT VIEWPORTS below.
       THE GRADIENT STAYS, and is now load-bearing in a way it was not
       before: it is what a visitor sees if an image never arrives, and
       what a <video> will sit against later. The img/video rule below
       already takes both. */
    .poster {
      width: min(340px, 74vw, 34vh); aspect-ratio: 2 / 3;
      border-radius: 3px; overflow: hidden; flex: none;
      background:
        radial-gradient(120% 100% at 30% 15%, #2a2740 0%, transparent 60%),
        radial-gradient(90% 90% at 78% 82%, #3a2a2a 0%, transparent 55%),
        linear-gradient(160deg, #141420 0%, #0d0d12 100%);
      box-shadow: 0 1px 0 rgba(255,255,255,.05) inset;
    }
    .poster img, .poster video { width: 100%; height: 100%; object-fit: cover; display: block; }

    .wordmark { font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); }
    .say      { max-width: 30rem; font-size: 17px; line-height: 1.55; color: var(--ink); margin: 0; }
    .sub      { max-width: 30rem; font-size: 14px; color: var(--dim); margin: 0; }
    a         { color: var(--dim); text-decoration: underline; text-underline-offset: 3px; }
    a:hover   { color: var(--ink); }

    /* THE STATUS LINE — one line, plain words. Reserved height so the
       layout never jumps as the words change. */
    #status {
      min-height: 1.5em; font-size: 15px; color: var(--dim);
      font-variant-numeric: tabular-nums;
    }

    /* THE LOG — behind a tap, never by default. */
    .logToggle {
      appearance: none; -webkit-appearance: none;
      background: none; border: 0; padding: 6px 10px; margin: 0;
      font: inherit; font-size: 12px; color: var(--faint);
      letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
    }
    .logToggle:hover { color: var(--dim); }
    .log {
      display: none; width: min(680px, 92vw); max-height: 34vh; overflow-y: auto;
      text-align: left; padding: 10px 12px; box-sizing: border-box;
      background: #08080a; border: 1px solid #1c1c22; border-radius: 3px;
      font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--faint); white-space: pre-wrap; word-break: break-word;
      -webkit-overflow-scrolling: touch;
    }
    .log.open { display: block; }

    .btn {
      appearance: none; background: transparent; color: var(--ink);
      border: 1px solid #33323c; border-radius: 2px;
      padding: 11px 22px; font: inherit; font-size: 14px; cursor: pointer;
      letter-spacing: .04em;
    }
    .btn:hover { border-color: #55525c; }

    #hint {
      position: fixed; left: 12px; bottom: 10px; z-index: 5;
      color: var(--faint); font-size: 12px;
      user-select: none; pointer-events: none;
    }
    #hint[hidden] { display: none; }
    /* Touch devices have no cursor to capture and no WASD. SHIP_1 owns
       the sticks; until then the hint would be a lie on a phone. */
    @media (pointer: coarse) { #hint { display: none; } }
    @media (prefers-reduced-motion: reduce) { #veil.lifting { transition: none; } }

    /* ── STATE 4 — READY ──────────────────────────────────────────
       ATMOS_0. Not a new card: the SAME veil, one line different. The
       poster and the wordmark do not move, because nothing about the
       piece changed — only what the visitor is being told. The status
       line stops being a report and becomes a door, in the button
       vocabulary this file already speaks (.btn, below). Placeholder
       wording and placeholder weight; the aesthetic pass owns both.

       The whole veil is the target, so the gesture is the one a phone
       actually makes. The log toggle and its pane opt out in JS. */
    #veil.ready { cursor: pointer; }
    #veil.ready #status {
      color: var(--ink);
      border: 1px solid #33323c; border-radius: 2px;
      padding: 11px 22px;
      letter-spacing: .06em;
    }
    #veil.ready #status:focus-visible { border-color: var(--dim); outline: none; }

    /* SHORT VIEWPORTS — a phone held sideways, and a small phone held
       upright. The overlay column is poster + wordmark + line + toggle,
       and everything under the poster falls off the bottom: in READY
       that clipped line is the DOOR, and in FALLBACK/LOST the same clip
       takes "Open it again" with it. The layer centres its column, so
       the overflow is spent at BOTH ends — the poster loses its top in
       the same breath.
       28vh, NOT the 34vh above and NOT the 42vh this rule used to
       carry. A width cap is a height cap times 3/2 now: 34vh is 51vh
       of height, and the old 42vh was 42vh of height only because the
       box was square. 28vh x 3/2 puts that 42vh back. Measured on the
       CARD, the taller of the two columns and the one that fails
       first: at 34vh it clipped 844x390 by 15px, 915x412 by 10px and
       320x568 by 8px, and at 28vh none of the three does.
       600px, NOT 560px: 320x568 is a portrait phone that clears the
       old cut-off and still cannot hold a 51vh poster.
       BELOW ~370px OF HEIGHT the card's column overflows anyway — 6px
       at 640x360, 18px at 568x320 — and it did so identically before
       POSTER_0, at 1:1 under the 42vh clamp. Left alone: closing it
       means taking more off the poster on every short viewport, which
       is a different trade from the one this rule makes.
       (The frame was never the problem — the canvas fills both
       orientations by construction, PORT_3c + --app-h.) */
    @media (max-height: 600px) {
      .poster { width: min(340px, 74vw, 28vh); }
      .layer  { gap: 14px; padding: 16px 24px; }
    }
  </style>
</head>
<body>
  <!-- FRAME_0 — the canvas's size comes from this container, not from a
       CSS rule on the canvas the library overrides. See #frame above. -->
  <div id="frame"><canvas id="canvas"></canvas></div>

  <!-- ATMOS_0 — THE SOUNDTRACK, AND THE ONLY AUDIO PATH IN THE PIECE.
       preload="none" and no src attribute: nothing crosses the wire
       until the entry gesture assigns data-src and calls play(), which
       is also the only moment iOS will accept. The URL has ONE home,
       here, and EXHIBIT_0's web_dist.py is what puts the file at it.
       This element is the future AnalyserNode socket — when the piece
       starts listening to itself, it listens here. Nothing else in the
       shell may create or touch audio. -->
  <audio id="music" loop preload="none" data-src="music/samsara.mp3"></audio>
  <div id="hint" hidden>click to capture the cursor &middot; WASD moves &middot; 5&ndash;8 change moods</div>

  <!-- ── STATE 1 — LOADING ─────────────────────────────────────── -->
  <div id="veil" class="layer">
    <div class="poster"><img src="veil_poster.jpg" alt="" decoding="async"></div>
    <div class="wordmark">the_board</div>
    <div id="status">Waking the world</div>
    <button id="logToggle" class="logToggle" type="button" aria-controls="log" aria-expanded="false">details</button>
    <pre id="log" class="log" aria-live="off"></pre>
  </div>

  <!-- ── STATES 2 &amp; 3 — FALLBACK / LOST ───────────────────────── -->
  <div id="card" class="layer" hidden>
    <!-- POSTER_0 — NO src ATTRIBUTE. The card is normally never seen,
         and a visitor whose device runs the piece must not pay for the
         image that says it cannot. showCard() assigns it: the same
         data-src idiom #music uses above, and deterministic where
         loading="lazy" is not, since a display:none image's behaviour
         is the browser's business and not this file's. The alt is real
         here — on an unsupported browser this card is the whole piece
         a person receives, and it is also what shows if the image
         never arrives. -->
    <div class="poster"><img id="cardPoster" alt="A painting from the piece" decoding="async" data-src="card_poster.jpg"></div>
    <div class="wordmark">the_board</div>
    <p class="say" id="cardSay"></p>
    <p class="sub" id="cardSub"></p>
    <button class="btn" id="reload" type="button" hidden>Open it again</button>
    <button id="logToggle2" class="logToggle" type="button" aria-controls="log2" aria-expanded="false">details</button>
    <pre id="log2" class="log" aria-live="off"></pre>
  </div>

  <script>
  (function () {
    'use strict';

    // ═══ SHIP_0 U3 — THE FIRST-CONTACT SHELL ═══════════════════════
    //
    // Three designed states; no visitor ever meets a white page or a
    // raw console. Zero wasm edits: the page already owns print and
    // printErr, and every trigger below is a line observed in the
    // 2026-08 captures (docs/RELEASE_CONSOLE.md).
    //
    // The coupling is deliberately LOOSE — substring tests on lines the
    // program prints for its own reasons. A renamed line degrades the
    // status wording, never the correctness: the veil's dismissal has a
    // watchdog, and the failure states trigger on lines whose text is
    // load-bearing elsewhere.

    var veil    = document.getElementById('veil');
    var card    = document.getElementById('card');
    var statusEl= document.getElementById('status');
    var cardSay = document.getElementById('cardSay');
    var cardSub = document.getElementById('cardSub');
    var reload  = document.getElementById('reload');
    var hint    = document.getElementById('hint');
    var logEl   = document.getElementById('log');
    var logEl2  = document.getElementById('log2');
    var music   = document.getElementById('music');
    var cardPoster = document.getElementById('cardPoster');

    // TWO flags, not one. `terminal` means a designed END was reached —
    // FALLBACK or LOST — and nothing may override it. `shown` merely
    // means the visitor is looking at something other than the veil.
    // The watchdog card sets `shown` WITHOUT `terminal`, so a boot that
    // finishes late still gets to present its world instead of leaving
    // a running piece hidden behind an apology.
    var terminal = false;
    var shown    = false;
    var lines    = [];            // the raw log, for the tap-to-open panel

    // ATMOS_0 — TWO MORE, AND NEITHER OUTRANKS ANYTHING. `entered` is
    // "the visitor has made the gesture", which is a fact about the
    // VISITOR and survives every state change. `ready` is "the veil is
    // currently offering the door", which is a fact about the SCREEN and
    // any card takes it away. They are separate because the gesture can
    // arrive before the offer does — an eager visitor mid-boot — and
    // that gesture must not be thrown away: audio and fullscreen are
    // only grantable inside it.
    var entered = false;
    var ready   = false;

    // Audio state. `musicWasPlaying` is the ONLY thing that decides a
    // resume, so a visitor who was given silence stays in silence.
    var musicWasPlaying = false;
    var wakeLock        = null;
    var wakeLockPending = false;

    // CONTACT — Jean's, and deliberately a placeholder. This page is
    // built to be deployed publicly; publishing a personal address is
    // his call to make, not this file's default. Replace the href and
    // the words, or delete the sentence that carries it.
    var CONTACT = '<a href="https://github.com/jeanklein1/7T-Pawns/issues">tell me about it</a>';

    // ── visual viewport: the URL bar's collapse must not letterbox the
    // piece, and rotation must resize it. Writes only a CSS variable —
    // the canvas backing store stays the console's business (PORT_3c).
    function sizeToViewport() {
      var vv = window.visualViewport;
      var h = vv ? vv.height : window.innerHeight;
      document.documentElement.style.setProperty('--app-h', h + 'px');
    }
    sizeToViewport();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', sizeToViewport);
      window.visualViewport.addEventListener('scroll', sizeToViewport);
    }
    window.addEventListener('resize', sizeToViewport);
    window.addEventListener('orientationchange', function () {
      setTimeout(sizeToViewport, 120);   // iOS reports late
    });

    // Suppress the browser's own gestures over the piece.
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('dblclick',     function (e) { e.preventDefault(); }, { passive: false });

    // ── the log panel, behind a tap ──────────────────────────────
    function wireToggle(btnId, paneId) {
      var b = document.getElementById(btnId), p = document.getElementById(paneId);
      if (!b || !p) return;
      b.addEventListener('click', function () {
        var open = p.classList.toggle('open');
        b.setAttribute('aria-expanded', open ? 'true' : 'false');
        b.textContent = open ? 'hide' : 'details';
        if (open) { p.textContent = lines.join('\n'); p.scrollTop = p.scrollHeight; }
      });
    }
    wireToggle('logToggle',  'log');
    wireToggle('logToggle2', 'log2');

    function record(text) {
      lines.push(text);
      if (lines.length > 4000) lines.splice(0, 1000);
      var pane = logEl2.classList.contains('open') ? logEl2
               : logEl.classList.contains('open')  ? logEl : null;
      if (pane) { pane.textContent = lines.join('\n'); pane.scrollTop = pane.scrollHeight; }
    }

    // ATMOS_1 — A SHELL DIAGNOSTIC GOES TO BOTH PLACES. record() writes
    // to the panel and nowhere else, which is right for the visitor and
    // was wrong for the phone on the end of a cable: every refusal the
    // entry gesture collected was filed where only an opened log panel
    // could show it. A remote DevTools session therefore watched
    // fullscreen complain — Chrome logs that one itself — while the
    // audio path, refused in the same breath for the same reason, said
    // nothing. That asymmetry is what cost the first pass.
    //
    // The wasm's own lines keep using record(): Module.print and
    // printErr have already put them on the console, and routing them
    // through here would print each one twice.
    function note(text) { console.log(text); record(text); }

    // ── STATE TRANSITIONS ────────────────────────────────────────
    function present() {                    // LOADING -> the world
      if (terminal) return;                 // a real end outranks the world
      card.hidden = true;                   // clears a watchdog card, if any
      shown = true;
      veil.classList.add('lifting');
      hint.hidden = false;
      setTimeout(function () { if (!terminal) veil.hidden = true; }, 950);
    }

    // ATMOS_0 — LOADING -> READY. The world is ALREADY LIVE behind this;
    // the tap reveals it, it does not boot it. L10 stands: there is still
    // exactly one way for the world to come into being, and this is not
    // a second one.
    //
    // Shaped as present()'s sibling on purpose — same terminal guard,
    // same card-clearing. A watchdog card may be on screen (it sets
    // `shown` without `terminal`, and hides the veil), and the boot
    // arriving is exactly the moment that card stops being true.
    function showReady() {
      if (terminal) return;               // a real end outranks the door
      card.hidden = true;                 // clears a watchdog card, if any
      veil.hidden = false;                // ...which had hidden the veil
      ready = true;
      // Set BEFORE the wording, so no late boot line can overwrite it:
      // say() writes only while !shown. It also disarms the watchdog,
      // correctly — the watchdog fires when a boot neither presents nor
      // fails, and this boot presented.
      shown = true;
      statusEl.textContent = ENTRY_WORDS;
      statusEl.setAttribute('role', 'button');
      statusEl.setAttribute('tabindex', '0');
      veil.classList.add('ready');
    }

    function showCard(say, sub, offerReload) {
      shown = true;
      veil.hidden = true;
      // The door is gone with the veil that carried it. Clearing the
      // class as well as the element keeps a hidden node from holding an
      // interactive state it can no longer honour.
      ready = false;
      veil.classList.remove('ready');
      cardSay.textContent = say;
      cardSub.innerHTML = sub;
      reload.hidden = !offerReload;
      // POSTER_0 — the fetch starts HERE, and BEFORE the unhide, so the
      // box is never shown holding alt text. Guarded because showCard is
      // reachable twice: LOST can follow a watchdog card, and the second
      // call must not restart a load already in flight.
      if (cardPoster && !cardPoster.getAttribute('src'))
        cardPoster.setAttribute('src', cardPoster.dataset.src || '');
      card.hidden = false;
    }

    function fallback(reason) {             // STATE 2 — cannot run
      if (terminal) return;
      terminal = true;
      showCard(
        'This piece needs WebGPU, and this browser cannot give it one.',
        'It runs today in Chrome and Edge on Android and desktop, and in Safari on iOS 26. ' +
        'A recording lives above. If you want to see it on the machine you have, ' + CONTACT + '.',
        false
      );
      record('[shell] FALLBACK: ' + reason);
    }

    // PROBATE_SEAL3 — STATE 2b: the program itself ruled the device out.
    //
    // Distinct from fallback(), and the distinction is the point.
    // fallback() fires when the SHELL cannot find WebGPU at all. This
    // fires when WebGPU is present, the wasm booted, and the program's
    // own floor found the one thing it cannot do without — the immediate
    // address space, its granted size, the encoder method that sets it,
    // or a shader whose bytes match the ones this build shipped.
    //
    // Until now that verdict was a console line the program printed and
    // then ignored: it went on to compile a shader it had just said
    // could not compile, ran a frame loop against a dead device, and
    // filled the log with thousands of validation errors while the
    // visitor watched a black canvas. On Firefox the missing JS surface
    // threw uncaught, every frame. The card is what a person should have
    // been meeting for all of it.
    //
    // Jean gates the exact wording and the look; this is the sober
    // default. Reload is NOT offered — a browser does not grow a feature
    // between two presses of the same button, and offering the retry
    // would be the interface lying about what went wrong.
    function floor(reason) {                // STATE 2b — ruled out by the program
      if (terminal) return;
      terminal = true;
      showCard(
        'THE EVER EXPANDING BOARD — This work runs on WebGPU immediates, which this browser does not yet speak. Open it in Chrome, Edge, or any current Chromium browser.',
        'It runs today in Chrome and Edge on Android and desktop. A recording lives ' +
        'above. If you want to see it on the machine you have, ' + CONTACT + '.',
        false
      );
      record('[shell] FLOOR: ' + reason);
    }

    function lost(reason) {                 // STATE 3 — was running, then died
      // Fires even after the veil lifted: a death mid-flight must
      // REPLACE the world, not sit invisibly behind a frozen frame.
      terminal = true;
      veil.classList.remove('lifting');
      showCard(
        'The world stopped.',
        "This device's graphics driver could not sustain the piece. " +
        'Opening it again sometimes works; if it never does, ' + CONTACT + '.',
        true
      );
      hint.hidden = true;
      record('[shell] LOST: ' + reason);
    }

    // L10 — the world has exactly one way to come into being. A reload
    // is the honest retry; an auto-retry would be a second door.
    reload.addEventListener('click', function () { window.location.reload(); });

    // ═══ ATMOS_0 — THE ENTRY GESTURE ═══════════════════════════════
    //
    // Three things a browser will only grant inside a real gesture, and
    // one that needs no permission at all. Each is INDEPENDENT and
    // non-fatal: a phone with no Fullscreen API, no Wake Lock, or a
    // codec it will not play still gets the piece. Every failure is
    // recorded to the log panel rather than swallowed, because "the
    // music did not start" is a thing a visitor may want to look up.

    var ENTRY_WORDS = 'tap to enter';   // placeholder; the aesthetic pass owns the words

    // 1 — THE SOUNDTRACK. src is assigned HERE, not in the markup: with
    // preload="none" and no src the element costs nothing until this
    // moment, and this moment is the one iOS accepts.
    function startMusic() {
      if (!music) { note('[shell] audio: no element'); return; }
      try {
        if (!music.getAttribute('src')) music.setAttribute('src', music.dataset.src || '');
        // THE INTENT IS RECORDED SYNCHRONOUSLY, before the promise. A
        // visitor who taps and immediately pockets the phone would
        // otherwise be read as "was not playing" by the visibility
        // handler — play() has not resolved yet, so the element is still
        // paused — and the piece would sing on, unpaused, in a pocket.
        // This flag means "sound is wanted", which is knowable now;
        // whether a decoder has caught up is not.
        musicWasPlaying = true;
        var p = music.play();
        if (p && p.then) {
          p.then(function () {
            // ...and the same race from the other side: if the tab went
            // away while the decoder was starting, honour it on arrival.
            if (document.hidden) music.pause();
          }, function (err) {
            // AbortError IS OUR OWN pause(). Per spec, pausing while a
            // play promise is pending rejects it — and the visibility
            // handler pauses unconditionally on hide. So the exact
            // sequence this design exists to survive, tap-then-pocket,
            // arrives here as a rejection. Reading it as "the visitor
            // never got audio" would clear the intent, skip the resume
            // AND skip the gesture rearm: the pocket would cost the
            // soundtrack for the rest of the session. Only a refusal
            // that is not ours withdraws consent.
            if (!err || err.name !== 'AbortError') musicWasPlaying = false;
            note('[shell] audio did not start: ' + err);
          });
        }
      } catch (err) {
        musicWasPlaying = false;
        note('[shell] audio did not start: ' + err);
      }
    }

    // 2 — FULLSCREEN, coarse pointers only. The same gate the hint uses
    // (@media (pointer: coarse)). A desktop visitor's entry is already
    // the pointer-lock hint, and taking their window away would be a
    // second, louder answer to a question they did not ask.
    function goFullscreen() {
      try {
        if (!window.matchMedia || !window.matchMedia('(pointer: coarse)').matches) return;
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (!req) { note('[shell] fullscreen: unavailable (older iOS stays in-page)'); return; }
        var r = req.call(el);
        if (r && r.catch) r.catch(function (err) { note('[shell] fullscreen refused: ' + err); });
      } catch (err) { note('[shell] fullscreen refused: ' + err); }
    }

    // 3 — WAKE LOCK. Absent API is a silent skip, not a log line: a
    // browser that never had the feature is not a failure to report.
    // The lock is dropped by the browser whenever the page hides, so
    // the visibility handler below re-asks rather than assuming.
    function requestWakeLock() {
      if (!navigator.wakeLock || !navigator.wakeLock.request) return;
      if (wakeLock || wakeLockPending) return;
      wakeLockPending = true;
      try {
        navigator.wakeLock.request('screen').then(function (sentinel) {
          wakeLockPending = false;
          wakeLock = sentinel;
          sentinel.addEventListener('release', function () { wakeLock = null; });
        }, function (err) {
          wakeLockPending = false;
          note('[shell] wake lock refused: ' + err);
        });
      } catch (err) {
        wakeLockPending = false;
        note('[shell] wake lock refused: ' + err);
      }
    }

    // ── ATMOS_1 — NOT EVERY GESTURE EVENT IS A GESTURE ────────────
    //
    // The three grants above are all spent inside a user activation, and
    // the HTML Standard's list of activation triggering input events is
    // both short and ASYMMETRIC:
    //
    //     keydown      always (bar Esc and reserved shortcuts)
    //     mousedown    always
    //     touchend     always
    //     pointerdown  ONLY when pointerType is "mouse"
    //     pointerup    ONLY when pointerType is NOT "mouse"
    //
    // So on a finger, pointerdown IS NOT A GESTURE, and everything asked
    // for inside it is refused. This file asked for all three there, and
    // the old comment on the binding — "the earliest event the browser
    // will accept" — was true of a mouse and false of a thumb.
    //
    // It survived because the two platforms disagree and only one of
    // them complains out loud. WebKit hands its activation to the whole
    // touch sequence, pointerdown included, so an iPhone ran the same
    // bytes and sang. Chromium implements the list as written: measured
    // in a real engine, a synthesized touch tap reports
    // navigator.userActivation.isActive === false throughout pointerdown
    // and true from pointerup on, and the two grants that need one —
    // play() and requestFullscreen() — are refused with NotAllowedError
    // at pointerdown and resolve at pointerup. (The wake lock happens
    // not to require an activation in Chromium and resolved either way.
    // It is issued with the others because the spec permits requiring
    // one, not because it is observed to.)
    //
    // Of the two that failed, only fullscreen has a console voice —
    // Chrome logs that refusal itself. So a Pixel on a cable showed
    // exactly one error, from the grant nobody was hunting, and silence
    // from the one that mattered. note(), above, is the other half of
    // this repair: the next refusal says so where the cable can hear it.
    //
    // The test below is on the EVENT, never on the platform. A mouse
    // still pays at pointerdown, which is the earliest it can; a finger
    // pays at pointerup, which is the earliest it may.
    function carriesActivation(e) {
      if (!e || !e.type) return false;
      if (e.type === 'pointerdown') return e.pointerType === 'mouse';
      if (e.type === 'pointerup')   return e.pointerType !== 'mouse';
      return true;                    // click, touchend, keydown
    }

    // ONE HANDLER. It is bound before the boot even starts, so an eager
    // visitor who taps mid-load is not ignored: the gesture is spent on
    // 1-3 immediately (it cannot be banked — the browser only honours it
    // now) and the reveal still waits for the world, arriving on the
    // "Controls:" line exactly as it does today.
    //
    // ATMOS_1: the reveal rides the SAME event as the grants rather than
    // an earlier one. Lifting the veil at pointerdown and granting at
    // pointerup would buy a phone the ~80 ms between them and cost the
    // correctness this function exists for — `entered` is one-shot, so
    // whichever event reaches it first is the only one that ever gets to
    // ask for audio, and on a finger that event must be the one holding
    // the activation.
    function onEntryGesture(e) {
      if (terminal) return;
      // The details toggle and its pane are controls, not the door.
      if (e && e.target && e.target.closest && e.target.closest('.logToggle, .log')) return;
      // Not a refusal — a wait. On a finger the activation is two frames
      // out, on pointerup, and this same handler is bound there.
      if (!carriesActivation(e)) return;
      if (!entered) {
        entered = true;
        startMusic();
        goFullscreen();
        requestWakeLock();
      }
      if (ready) {
        ready = false;
        veil.classList.remove('ready');
        statusEl.removeAttribute('role');
        statusEl.removeAttribute('tabindex');
        present();
      }
    }

    // Both pointer halves are bound and carriesActivation picks whichever
    // one can actually pay. `click` is the floor beneath both: it is
    // activation-triggering everywhere and fires even where pointer
    // events do not. It costs nothing when it is not needed — after a
    // successful entry the veil is already pointer-events:none, and the
    // `entered`/`ready` guards make a second arrival a no-op regardless.
    veil.addEventListener('pointerdown', onEntryGesture);
    veil.addEventListener('pointerup',   onEntryGesture);
    veil.addEventListener('click',       onEntryGesture);
    // The keyboard's way in. A gesture is a gesture — this unlocks audio
    // and fullscreen exactly as the finger does.
    statusEl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        onEntryGesture(e);
      }
    });

    // ── ATMOS_0 R — WHEN THE OS REVOKES THE SESSION ───────────────
    // Field, iPhone 14: leave the browser long enough and Safari tears
    // the media session down. The play() on return is then a play()
    // WITHOUT a gesture, and it is refused — correctly, by the rules
    // the entry tap existed to satisfy in the first place.
    //
    // So this does not fight the refusal, it waits for the next
    // gesture and spends it. One shot: the listeners remove themselves
    // the moment audio is sounding again, and `resumeArmed` keeps a
    // second refusal from stacking a second set. If the visitor never
    // touches again, three idle listeners on a page they have left is
    // the entire cost.
    //
    // ATMOS_1 — THE SAME ACTIVATION LAW, AND THIS PATH BROKE THE SAME
    // WAY. This waited on pointerdown and touchstart. Neither appears on
    // the list above — touchstart is absent from it outright, and
    // pointerdown counts only for a mouse — so on Chromium a refusal
    // that a touch was supposed to cure could be touched forever and
    // stay refused. It read as correct because iOS is the platform it
    // was written for and WebKit does honour both.
    //
    // pointerup and touchend replace them, with pointerdown kept for the
    // mouse, and carriesActivation deciding which one pays. touchend is
    // not redundant with pointerup: it is the second activating event of
    // a single tap, so iOS gets two independent chances at the same
    // finger — and `retrying` still makes that tap buy exactly one
    // play(), which matters because the second would be a second refusal
    // line in the log for one gesture.
    //
    // (`click` is the entry gesture's floor but not this one's: these
    // are capture-phase on document for the whole session, and a click
    // is synthesized by things a touch is not.)
    var resumeArmed = false;
    var retrying = false;
    function armResumeOnGesture() {
      if (resumeArmed) return;
      resumeArmed = true;
      note('[shell] audio resume needs a gesture — the next touch will restore it');

      function disarm() {
        resumeArmed = false;
        document.removeEventListener('pointerdown', retry, true);
        document.removeEventListener('pointerup',   retry, true);
        document.removeEventListener('touchend',    retry, true);
      }
      function retry(e) {
        if (retrying) return;          // one tap, one attempt (two of these fire)
        // A gesture that grants nothing cannot cure a refusal that only
        // a grant will lift. Spending a play() on it would buy a second
        // NotAllowedError and a log line saying so.
        if (!carriesActivation(e)) return;
        // The visitor may have hidden the tab again, or asked for
        // silence some other way, between the refusal and this touch.
        // `terminal` for the same reason onEntryGesture checks it: after
        // LOST or FALLBACK the visitor is looking at an apology, and the
        // soundtrack must not start over a dead world.
        if (terminal || !music || !musicWasPlaying || document.hidden) { disarm(); return; }
        retrying = true;
        try {
          var p = music.play();
          if (p && p.then) {
            p.then(function () {
              retrying = false;
              note('[shell] audio restored by gesture');
              disarm();
            }, function (err) {
              retrying = false;
              note('[shell] audio still refused: ' + err);
              // ONLY A MISSING GESTURE IS CURABLE BY A GESTURE. Stay
              // armed for NotAllowedError — another touch is another
              // chance. Anything else (an unsupported codec, a decode
              // failure, a dead audio route) will refuse identically
              // forever, and these listeners are capture-phase on
              // document: in a piece driven by touch they would spend a
              // play() and a log line on EVERY finger-down for the rest
              // of the session.
              if (!err || err.name !== 'NotAllowedError') disarm();
            });
          } else {
            retrying = false;
            disarm();
          }
        } catch (err) {
          retrying = false;
          note('[shell] audio still refused: ' + err);
          disarm();   // a throw is not a refusal a gesture can cure
        }
      }
      // Capture phase, so a gesture consumed elsewhere (the entry tap,
      // a control) still counts as the gesture that pays for this.
      document.addEventListener('pointerdown', retry, true);
      document.addEventListener('pointerup',   retry, true);
      document.addEventListener('touchend',    retry, true);
    }

    // ── ATMOS_0 U2 — THE PIECE DOES NOT SING FROM A POCKET ────────
    // Hidden pauses unconditionally; visible resumes ONLY if it was
    // playing, so silence chosen (or never granted) stays chosen. The
    // wake lock is re-asked here because the browser drops it on hide —
    // and only if the visitor ever entered, so a backgrounded LOADING
    // tab does not quietly hold the screen awake.
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        // Unconditional: pausing something already paused costs nothing,
        // and musicWasPlaying is not re-derived from element state here
        // — it is the visitor's standing answer, set at the gesture.
        if (music) { try { music.pause(); } catch (err) { /* nothing to pause */ } }
        return;
      }
      if (music && musicWasPlaying) {
        try {
          var p = music.play();
          if (p && p.catch) p.catch(function (err) {
            note('[shell] audio did not resume: ' + err);
            armResumeOnGesture();       // ATMOS_0 R — honour the refusal
          });
        } catch (err) {
          note('[shell] audio did not resume: ' + err);
          armResumeOnGesture();
        }
      }
      if (entered) requestWakeLock();
    });

    // ── STATUS: boot phases -> plain words ───────────────────────
    //
    // The phases print on COMPLETION, so each line announces the phase
    // that is ABOUT to run. The long one on the web twin is the wait
    // between "Renderer init" and "Patch system" — 56.9 s in the
    // capture — which is where the deferred pipeline-compile storm
    // comes due (see the WHERE A TIMER POINTS candidate in LAWS.md).
    // Counts are PARSED, never hardcoded: the painting total comes off
    // the scan line, and pipelines are counted bare because the program
    // prints no total. A number typed here would be a P5 violation
    // waiting for the next pipeline to be added.
    var pipelines = 0, paintings = 0, paintingTotal = 0;
    function say(t) { if (!shown) statusEl.textContent = t; }

    function classify(t) {
      if (t.indexOf('[Device] requesting') > -1) {
        say('Asking your device for a GPU'); return;
      }
      if (t.indexOf('[Device] adapter:') > -1)        { say('Reserving memory'); return; }
      if (t.indexOf('[Device] KEEPING the device') > -1) { say('Reserving memory'); return; }
      if (t.indexOf('[Cartridge] GPUState init') > -1){ say('Compiling shaders'); return; }
      if (t.indexOf('[Pipeline]') > -1) {
        pipelines++; say('Compiling shaders (' + pipelines + ')'); return;
      }
      if (t.indexOf('found') > -1 && t.indexOf('paintings') > -1) {
        var m = t.match(/found\s+(\d+)\s+paintings/);
        if (m) paintingTotal = parseInt(m[1], 10);
        say('Hanging the paintings'); return;
      }
      if (t.indexOf('[Authored] Loaded:') > -1) {
        paintings++;
        say('Hanging the paintings (' + paintings +
            (paintingTotal ? '/' + paintingTotal : '') + ')');
        return;
      }
      if (t.indexOf('[Cartridge] Renderer init') > -1) {
        say('Growing the terrain — the long part'); return;
      }
      if (t.indexOf('[Cartridge] Patch system') > -1) { say('Settling the ground'); return; }
      if (t.indexOf('[Incubator] the_board renderer ready') > -1) { say('Opening the doors'); return; }
    }

    // ── THE LINE HANDLER — one place, both streams ───────────────
    function onLine(text) {
      if (typeof text !== 'string') { try { text = String(text); } catch (e) { return; } }
      record(text);

      // TERMINAL STATES FIRST — these tests must win over any status
      // wording, and each binds to a line whose text is load-bearing
      // where it is printed.
      // PROBATE_SEAL3 — the program's own floor outranks every status
      // line, and it is checked FIRST among the terminal tests because
      // it is the only one that fires while the boot still looks
      // healthy: the wasm is running, WebGPU exists, and the device is
      // simply not one this work can run on. `[Floor] STOP` is printed
      // exactly where the floor fails (renderer.hpp floorHolds, and
      // loadShader for the serve digest) and is load-bearing text there.
      if (text.indexOf('[Floor] STOP') > -1) { floor(text); return; }
      if (text.indexOf('[Device] LOST') > -1) { lost(text); return; }
      if (text.indexOf('RequestAdapter failed:') > -1) { fallback(text); return; }
      if (text.indexOf('Failed to create WebGPU instance') > -1) { fallback(text); return; }
      // Only the PASSTHROUGH device failure is terminal — the modest
      // request failing is followed by a reissue (console.hpp,
      // request_device_web), and showing the card there would be a lie
      // about a boot that is still going.
      if (text.indexOf('RequestDevice failed (full adapter passthrough)') > -1) {
        fallback(text); return;
      }

      // DISMISSAL. "Controls:" is printed once the frame loop is live —
      // the cleanest "world visible" moment the log offers. Boot's
      // FADE_IN covers the rest, so the veil cross-dissolves into the
      // fade rather than cutting to a finished frame.
      //
      // ATMOS_0 forks the destination, not the trigger: a visitor who
      // already tapped gets the world now, exactly as before; one who
      // has not gets the door. Either way the world is live from this
      // line onward — the veil is the only thing still deciding.
      if (text.indexOf('Controls:') === 0) {
        if (entered) present(); else showReady();
        return;
      }

      classify(text);
    }

    // ── THE GATE: check WebGPU BEFORE fetching the wasm ──────────
    // An unsupported phone should pay nothing for a download it cannot
    // use. This is the only ordering constraint in the file.
    // Truthiness, not `'gpu' in navigator`: a browser can carry the
    // property and hand back undefined (and a policy/permissions block
    // looks exactly like that). `in` returns true for both, and the
    // visitor would then pay for a wasm that can never start.
    if (!navigator.gpu) {
      fallback('navigator.gpu absent or undefined — checked before fetching the wasm');
      return;
    }

    // ── BUILDID_0 — A NAME THAT CHANGES WHEN THE PROGRAM CHANGES ──
    //
    // THIS FILE IS A SOURCE FILE AND IT DOES NOT BOOT. The three build
    // artifacts always move together on disk, but their URLs were
    // constant across every deploy — so a browser holding one from a
    // previous visit could pair it with a fresh sibling: old glue
    // against new wasm, imports landing undefined. Cloudflare's
    // must-revalidate + ETag makes that rare, not impossible; a 304 on
    // one file and a 200 on another is the whole failure.
    //
    // tools/web_dist.py substitutes the placeholder below with the first
    // 12 hex of sha256(the_board.wasm) and writes the result to
    // dist/index.html. dist/index.html is GENERATED; this copy is not a
    // deployable page. Opening it directly asks for a script whose query
    // is still the unsubstituted placeholder, and fails — correct and
    // intended. The placeholder appears exactly ONCE in this file, on
    // the next line, so the substitution has one target and the dist
    // script's refusal-to-ship check has one thing to count.
    var BUILD = '__BUILD_ID__';

    // ── PROBATE_SEAL2 — THE SERVE WITNESS ──────────────────────
    //
    // The Pixel was served a world.wgsl cut mid-token 665 bytes from
    // its end. The tree was clean, every gate was green, and the
    // packaging copies the shader's bundle byte for byte — so the
    // defect lived in the one stretch nothing witnessed: the corridor
    // between the build and the device. It reached the audience as
    // `:13639:28 expected ')'`, a syntax error in a file that has none.
    //
    // tools/web_dist.py substitutes the placeholder below with the
    // first 8 hex of sha256(world.wgsl) — the same file --preload-file
    // packs into the_board.data. The program hashes the bytes it
    // actually loaded and compares (renderer.hpp, loadShader). The
    // whole incident becomes one console line, and a MISMATCH stops
    // the boot rather than narrating it.
    //
    // Same rule as BUILD: the placeholder appears exactly ONCE in this
    // file, so the substitution has one target and web_dist's
    // refusal-to-ship check has one thing to count.
    var SHADER_SHA = '__SHADER_SHA__';

    // contrib.glfw3 convention: its default canvas selector is literally
    // "Module['canvas']" (emscripten-glfw Config.h kDefaultCanvasSelector),
    // so handing the canvas to Module wires the GLFW window to it.
    // Pointer Lock is requested by contrib.glfw3 on the first user
    // gesture — the browser requires one; hence the hint.
    // PROBATE_SEAL2 — the digest reaches the program as a global, read
    // once in loadShader(). A Module field would be the tidier home,
    // but Module is rebuilt by the glue and the read happens long after
    // that; a plain global is the one thing both sides can name without
    // depending on Emscripten's lifecycle.
    window.SHADER_SHA = SHADER_SHA;

    window.Module = {
      canvas: document.getElementById('canvas'),
      // The .wasm and the .data are fetched by the glue, not by us, so
      // the version has to reach them through the one hook Emscripten
      // offers. Same id as the script tag below: one program, one name.
      locateFile: function (path, prefix) { return prefix + path + '?v=' + BUILD; },
      print:    function (t) { console.log(t); onLine(t); },
      // console.log, not console.error, for BOTH streams. The program
      // writes ordinary progress to stderr — every line the wasm prints
      // through printErr was arriving decorated with a thirty-frame
      // stack trace that describes the Emscripten glue and never the
      // program. It halves the length of a phone session's log and
      // costs nothing: the lines that matter are matched by text in
      // onLine(), not by which stream carried them.
      printErr: function (t) { console.log(t); onLine(t); }
    };

    // A wasm that never arrives is the other white page. 404, a broken
    // .data, an out-of-memory instantiation: all of them land here.
    window.addEventListener('error', function (e) {
      if (terminal) return;
      var m = e && e.message ? e.message : '';
      if (/wasm|WebAssembly|memory/i.test(m)) fallback('wasm failed: ' + m);
    });

    var s = document.createElement('script');
    s.src = 'the_board.js?v=' + BUILD;
    s.async = true;
    s.onerror = function () { fallback('the_board.js failed to load'); };
    document.body.appendChild(s);

    // ORGAN_0c — the control panel, gated at ?organ=1. The file always
    // ships and always loads; it returns on its second line without the
    // flag, so it builds no DOM, adds no stylesheet, starts no timer and
    // calls nothing. It does NOT hook this boot's choreography — no
    // onRuntimeInitialized, no wrapping of Module.print — because that
    // choreography carries the watchdog and the fallback and is not worth
    // risking for an instrument. It waits by asking instead.
    // NOT terminal on failure, deliberately: a panel that fails to load
    // must never be able to take the world down with it.
    var op = document.createElement('script');
    op.src = 'organ_panel.js?v=' + BUILD;
    op.async = true;
    op.onerror = function () { console.log('[ORGAN] panel script absent'); };
    document.body.appendChild(op);

    // WATCHDOG. If the boot neither presents nor fails — the shape a
    // driver hang takes, and the shape a renamed "Controls:" line would
    // also take — the visitor still gets a designed destination rather
    // than a poster that never lifts. Generous, because a first visit on
    // a phone legitimately pays the whole compile storm (56.9 s observed
    // on the dev laptop's web twin) and a slow phone may pay more.
    // NOT terminal, by construction: the boot keeps running underneath,
    // and if it finishes the "Controls:" line still calls present(),
    // which clears this card. A slow phone that eventually makes it
    // gets its world, not a permanent apology.
    setTimeout(function () {
      if (shown || terminal) return;
      showCard(
        'This is taking longer than it should.',
        'The piece may still be building — leave it a moment and it may still arrive, ' +
        'or open it again. If it never does, ' + CONTACT + ' and say what you are holding.',
        true
      );
    }, 240000);
  })();
  </script>
</body>
</html>
