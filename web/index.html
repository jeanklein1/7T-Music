<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- SHIP_0 U3 — mobile correctness (not optimization). viewport-fit=cover
       so the canvas reaches under the notch; user-scalable=no so a
       two-finger gesture belongs to the piece, not to the browser. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0c">
  <title>the_board</title>
  <style>
    /* ── THE PAGE ──────────────────────────────────────────────────
       Dark, one canvas, three states over it. No framework, no CSS
       files, no external asset: the page must render its FALLBACK on a
       device that never gets to run anything. */
    :root {
      --ink:   #e8e6e0;
      --dim:   #8a8792;
      --faint: #55525c;
      --bg:    #0a0a0c;
      /* --app-h is maintained from visualViewport where available; the
         100% fallback is correct everywhere else. */
      --app-h: 100%;
    }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg); color: var(--ink);
      overflow: hidden; overscroll-behavior: none;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* THE CANVAS. Sized by CSS at 100% and NOTHING ELSE — console.hpp's
       PORT_3c pixel cap reads glfwGetWindowSize (CSS px) against the
       framebuffer size and derives the DPR from their ratio, and its
       banner states the contract: "The canvas ELEMENT still fills the
       page — web/index.html sizes it with CSS (width/height 100%)."
       Setting .width/.height here would fight the cap. Do not. */
    #canvas {
      position: fixed; inset: 0;
      width: 100%; height: var(--app-h);
      display: block; outline: none;
      touch-action: none;                 /* no scroll/zoom hijacking the piece */
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── OVERLAY SKELETON, shared by all three states ─────────────── */
    .layer {
      position: fixed; inset: 0; height: var(--app-h);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 22px; padding: 32px 24px;
      box-sizing: border-box; text-align: center;
      background: var(--bg);
      z-index: 10;
    }
    .layer[hidden] { display: none; }
    #veil.lifting { opacity: 0; pointer-events: none; transition: opacity 900ms ease; }

    /* THE POSTER SLOT — Jean's aesthetic gate. Swap the inside of
       .poster for <img src="poster.jpg"> or a muted looping <video>.
       The gradient is a placeholder that costs no request. */
    .poster {
      width: min(340px, 74vw); aspect-ratio: 1 / 1;
      border-radius: 3px; overflow: hidden; flex: none;
      background:
        radial-gradient(120% 100% at 30% 15%, #2a2740 0%, transparent 60%),
        radial-gradient(90% 90% at 78% 82%, #3a2a2a 0%, transparent 55%),
        linear-gradient(160deg, #141420 0%, #0d0d12 100%);
      box-shadow: 0 1px 0 rgba(255,255,255,.05) inset;
    }
    .poster img, .poster video { width: 100%; height: 100%; object-fit: cover; display: block; }

    .wordmark { font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: var(--faint); }
    .say      { max-width: 30rem; font-size: 17px; line-height: 1.55; color: var(--ink); margin: 0; }
    .sub      { max-width: 30rem; font-size: 14px; color: var(--dim); margin: 0; }
    a         { color: var(--dim); text-decoration: underline; text-underline-offset: 3px; }
    a:hover   { color: var(--ink); }

    /* THE STATUS LINE — one line, plain words. Reserved height so the
       layout never jumps as the words change. */
    #status {
      min-height: 1.5em; font-size: 15px; color: var(--dim);
      font-variant-numeric: tabular-nums;
    }

    /* THE LOG — behind a tap, never by default. */
    .logToggle {
      appearance: none; -webkit-appearance: none;
      background: none; border: 0; padding: 6px 10px; margin: 0;
      font: inherit; font-size: 12px; color: var(--faint);
      letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
    }
    .logToggle:hover { color: var(--dim); }
    .log {
      display: none; width: min(680px, 92vw); max-height: 34vh; overflow-y: auto;
      text-align: left; padding: 10px 12px; box-sizing: border-box;
      background: #08080a; border: 1px solid #1c1c22; border-radius: 3px;
      font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--faint); white-space: pre-wrap; word-break: break-word;
      -webkit-overflow-scrolling: touch;
    }
    .log.open { display: block; }

    .btn {
      appearance: none; background: transparent; color: var(--ink);
      border: 1px solid #33323c; border-radius: 2px;
      padding: 11px 22px; font: inherit; font-size: 14px; cursor: pointer;
      letter-spacing: .04em;
    }
    .btn:hover { border-color: #55525c; }

    #hint {
      position: fixed; left: 12px; bottom: 10px; z-index: 5;
      color: var(--faint); font-size: 12px;
      user-select: none; pointer-events: none;
    }
    #hint[hidden] { display: none; }
    /* Touch devices have no cursor to capture and no WASD. SHIP_1 owns
       the sticks; until then the hint would be a lie on a phone. */
    @media (pointer: coarse) { #hint { display: none; } }
    @media (prefers-reduced-motion: reduce) { #veil.lifting { transition: none; } }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hint" hidden>click to capture the cursor &middot; WASD moves &middot; 5&ndash;8 change moods</div>

  <!-- ── STATE 1 — LOADING ─────────────────────────────────────── -->
  <div id="veil" class="layer">
    <div class="poster"><!-- POSTER SLOT (Jean): <img> or muted looping <video> --></div>
    <div class="wordmark">the_board</div>
    <div id="status">Waking the world</div>
    <button id="logToggle" class="logToggle" type="button" aria-controls="log" aria-expanded="false">details</button>
    <pre id="log" class="log" aria-live="off"></pre>
  </div>

  <!-- ── STATES 2 &amp; 3 — FALLBACK / LOST ───────────────────────── -->
  <div id="card" class="layer" hidden>
    <div class="poster"><!-- POSTER SLOT (Jean): stills, or a short video of the piece --></div>
    <div class="wordmark">the_board</div>
    <p class="say" id="cardSay"></p>
    <p class="sub" id="cardSub"></p>
    <button class="btn" id="reload" type="button" hidden>Open it again</button>
    <button id="logToggle2" class="logToggle" type="button" aria-controls="log2" aria-expanded="false">details</button>
    <pre id="log2" class="log" aria-live="off"></pre>
  </div>

  <script>
  (function () {
    'use strict';

    // ═══ SHIP_0 U3 — THE FIRST-CONTACT SHELL ═══════════════════════
    //
    // Three designed states; no visitor ever meets a white page or a
    // raw console. Zero wasm edits: the page already owns print and
    // printErr, and every trigger below is a line observed in the
    // 2026-08 captures (audit/THE BOARD FULL RELEASE CONSOLE.md).
    //
    // The coupling is deliberately LOOSE — substring tests on lines the
    // program prints for its own reasons. A renamed line degrades the
    // status wording, never the correctness: the veil's dismissal has a
    // watchdog, and the failure states trigger on lines whose text is
    // load-bearing elsewhere.

    var veil    = document.getElementById('veil');
    var card    = document.getElementById('card');
    var statusEl= document.getElementById('status');
    var cardSay = document.getElementById('cardSay');
    var cardSub = document.getElementById('cardSub');
    var reload  = document.getElementById('reload');
    var hint    = document.getElementById('hint');
    var logEl   = document.getElementById('log');
    var logEl2  = document.getElementById('log2');

    // TWO flags, not one. `terminal` means a designed END was reached —
    // FALLBACK or LOST — and nothing may override it. `shown` merely
    // means the visitor is looking at something other than the veil.
    // The watchdog card sets `shown` WITHOUT `terminal`, so a boot that
    // finishes late still gets to present its world instead of leaving
    // a running piece hidden behind an apology.
    var terminal = false;
    var shown    = false;
    var lines    = [];            // the raw log, for the tap-to-open panel

    // CONTACT — Jean's, and deliberately a placeholder. This page is
    // built to be deployed publicly; publishing a personal address is
    // his call to make, not this file's default. Replace the href and
    // the words, or delete the sentence that carries it.
    var CONTACT = '<a href="https://github.com/jeanklein1/7T-Pawns/issues">tell me about it</a>';

    // ── visual viewport: the URL bar's collapse must not letterbox the
    // piece, and rotation must resize it. Writes only a CSS variable —
    // the canvas backing store stays the console's business (PORT_3c).
    function sizeToViewport() {
      var vv = window.visualViewport;
      var h = vv ? vv.height : window.innerHeight;
      document.documentElement.style.setProperty('--app-h', h + 'px');
    }
    sizeToViewport();
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', sizeToViewport);
      window.visualViewport.addEventListener('scroll', sizeToViewport);
    }
    window.addEventListener('resize', sizeToViewport);
    window.addEventListener('orientationchange', function () {
      setTimeout(sizeToViewport, 120);   // iOS reports late
    });

    // Suppress the browser's own gestures over the piece.
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('dblclick',     function (e) { e.preventDefault(); }, { passive: false });

    // ── the log panel, behind a tap ──────────────────────────────
    function wireToggle(btnId, paneId) {
      var b = document.getElementById(btnId), p = document.getElementById(paneId);
      if (!b || !p) return;
      b.addEventListener('click', function () {
        var open = p.classList.toggle('open');
        b.setAttribute('aria-expanded', open ? 'true' : 'false');
        b.textContent = open ? 'hide' : 'details';
        if (open) { p.textContent = lines.join('\n'); p.scrollTop = p.scrollHeight; }
      });
    }
    wireToggle('logToggle',  'log');
    wireToggle('logToggle2', 'log2');

    function record(text) {
      lines.push(text);
      if (lines.length > 4000) lines.splice(0, 1000);
      var pane = logEl2.classList.contains('open') ? logEl2
               : logEl.classList.contains('open')  ? logEl : null;
      if (pane) { pane.textContent = lines.join('\n'); pane.scrollTop = pane.scrollHeight; }
    }

    // ── STATE TRANSITIONS ────────────────────────────────────────
    function present() {                    // LOADING -> the world
      if (terminal) return;                 // a real end outranks the world
      card.hidden = true;                   // clears a watchdog card, if any
      shown = true;
      veil.classList.add('lifting');
      hint.hidden = false;
      setTimeout(function () { if (!terminal) veil.hidden = true; }, 950);
    }

    function showCard(say, sub, offerReload) {
      shown = true;
      veil.hidden = true;
      cardSay.textContent = say;
      cardSub.innerHTML = sub;
      reload.hidden = !offerReload;
      card.hidden = false;
    }

    function fallback(reason) {             // STATE 2 — cannot run
      if (terminal) return;
      terminal = true;
      showCard(
        'This piece needs WebGPU, and this browser cannot give it one.',
        'It runs today in Chrome and Edge on Android and desktop, and in Safari on iOS 26. ' +
        'A recording lives above. If you want to see it on the machine you have, ' + CONTACT + '.',
        false
      );
      record('[shell] FALLBACK: ' + reason);
    }

    function lost(reason) {                 // STATE 3 — was running, then died
      // Fires even after the veil lifted: a death mid-flight must
      // REPLACE the world, not sit invisibly behind a frozen frame.
      terminal = true;
      veil.classList.remove('lifting');
      showCard(
        'The world stopped.',
        "This device's graphics driver could not sustain the piece. " +
        'Opening it again sometimes works; if it never does, ' + CONTACT + '.',
        true
      );
      hint.hidden = true;
      record('[shell] LOST: ' + reason);
    }

    // L10 — the world has exactly one way to come into being. A reload
    // is the honest retry; an auto-retry would be a second door.
    reload.addEventListener('click', function () { window.location.reload(); });

    // ── STATUS: boot phases -> plain words ───────────────────────
    //
    // The phases print on COMPLETION, so each line announces the phase
    // that is ABOUT to run. The long one on the web twin is the wait
    // between "Renderer init" and "Patch system" — 56.9 s in the
    // capture — which is where the deferred pipeline-compile storm
    // comes due (see the WHERE A TIMER POINTS candidate in LAWS.md).
    // Counts are PARSED, never hardcoded: the painting total comes off
    // the scan line, and pipelines are counted bare because the program
    // prints no total. A number typed here would be a P5 violation
    // waiting for the next pipeline to be added.
    var pipelines = 0, paintings = 0, paintingTotal = 0;
    function say(t) { if (!shown) statusEl.textContent = t; }

    function classify(t) {
      if (t.indexOf('[Device] requesting') > -1) {
        say('Asking your device for a GPU'); return;
      }
      if (t.indexOf('[Device] adapter:') > -1)        { say('Reserving memory'); return; }
      if (t.indexOf('[Device] KEEPING the device') > -1) { say('Reserving memory'); return; }
      if (t.indexOf('[Cartridge] GPUState init') > -1){ say('Compiling shaders'); return; }
      if (t.indexOf('[Pipeline]') > -1) {
        pipelines++; say('Compiling shaders (' + pipelines + ')'); return;
      }
      if (t.indexOf('found') > -1 && t.indexOf('paintings') > -1) {
        var m = t.match(/found\s+(\d+)\s+paintings/);
        if (m) paintingTotal = parseInt(m[1], 10);
        say('Hanging the paintings'); return;
      }
      if (t.indexOf('[Authored] Loaded:') > -1) {
        paintings++;
        say('Hanging the paintings (' + paintings +
            (paintingTotal ? '/' + paintingTotal : '') + ')');
        return;
      }
      if (t.indexOf('[Cartridge] Renderer init') > -1) {
        say('Growing the terrain — the long part'); return;
      }
      if (t.indexOf('[Cartridge] Patch system') > -1) { say('Settling the ground'); return; }
      if (t.indexOf('[Incubator] the_board renderer ready') > -1) { say('Opening the doors'); return; }
    }

    // ── THE LINE HANDLER — one place, both streams ───────────────
    function onLine(text) {
      if (typeof text !== 'string') { try { text = String(text); } catch (e) { return; } }
      record(text);

      // TERMINAL STATES FIRST — these tests must win over any status
      // wording, and each binds to a line whose text is load-bearing
      // where it is printed.
      if (text.indexOf('[Device] LOST') > -1) { lost(text); return; }
      if (text.indexOf('RequestAdapter failed:') > -1) { fallback(text); return; }
      if (text.indexOf('Failed to create WebGPU instance') > -1) { fallback(text); return; }
      // Only the PASSTHROUGH device failure is terminal — the modest
      // request failing is followed by a reissue (console.hpp,
      // request_device_web), and showing the card there would be a lie
      // about a boot that is still going.
      if (text.indexOf('RequestDevice failed (full adapter passthrough)') > -1) {
        fallback(text); return;
      }

      // DISMISSAL. "Controls:" is printed once the frame loop is live —
      // the cleanest "world visible" moment the log offers. Boot's
      // FADE_IN covers the rest, so the veil cross-dissolves into the
      // fade rather than cutting to a finished frame.
      if (text.indexOf('Controls:') === 0) { present(); return; }

      classify(text);
    }

    // ── THE GATE: check WebGPU BEFORE fetching the wasm ──────────
    // An unsupported phone should pay nothing for a download it cannot
    // use. This is the only ordering constraint in the file.
    // Truthiness, not `'gpu' in navigator`: a browser can carry the
    // property and hand back undefined (and a policy/permissions block
    // looks exactly like that). `in` returns true for both, and the
    // visitor would then pay for a wasm that can never start.
    if (!navigator.gpu) {
      fallback('navigator.gpu absent or undefined — checked before fetching the wasm');
      return;
    }

    // contrib.glfw3 convention: its default canvas selector is literally
    // "Module['canvas']" (emscripten-glfw Config.h kDefaultCanvasSelector),
    // so handing the canvas to Module wires the GLFW window to it.
    // Pointer Lock is requested by contrib.glfw3 on the first user
    // gesture — the browser requires one; hence the hint.
    window.Module = {
      canvas: document.getElementById('canvas'),
      print:    function (t) { console.log(t);   onLine(t); },
      printErr: function (t) { console.error(t); onLine(t); }
    };

    // A wasm that never arrives is the other white page. 404, a broken
    // .data, an out-of-memory instantiation: all of them land here.
    window.addEventListener('error', function (e) {
      if (terminal) return;
      var m = e && e.message ? e.message : '';
      if (/wasm|WebAssembly|memory/i.test(m)) fallback('wasm failed: ' + m);
    });

    var s = document.createElement('script');
    s.src = 'the_board.js';
    s.async = true;
    s.onerror = function () { fallback('the_board.js failed to load'); };
    document.body.appendChild(s);

    // WATCHDOG. If the boot neither presents nor fails — the shape a
    // driver hang takes, and the shape a renamed "Controls:" line would
    // also take — the visitor still gets a designed destination rather
    // than a poster that never lifts. Generous, because a first visit on
    // a phone legitimately pays the whole compile storm (56.9 s observed
    // on the dev laptop's web twin) and a slow phone may pay more.
    // NOT terminal, by construction: the boot keeps running underneath,
    // and if it finishes the "Controls:" line still calls present(),
    // which clears this card. A slow phone that eventually makes it
    // gets its world, not a permanent apology.
    setTimeout(function () {
      if (shown || terminal) return;
      showCard(
        'This is taking longer than it should.',
        'The piece may still be building — leave it a moment and it may still arrive, ' +
        'or open it again. If it never does, ' + CONTACT + ' and say what you are holding.',
        true
      );
    }, 240000);
  })();
  </script>
</body>
</html>
