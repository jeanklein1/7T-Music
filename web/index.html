<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>7T · gallery</title>
<style>
  /* Two-tier tokens — identical shape to harness.html; re-theme via palette tier only. */
  :root {
    /* palette tier — literal hues (from the oil) */
    --sand:      #EFE6D4;
    --bone:      #E1D3B6;
    --ink:       #211E1C;
    --ink-soft:  #5A554C;
    --sky:       #6E9BC0;
    --coral:     #DC987B;
    --gold:      #E0A24E;
    --olive:     #9DA177;
    --lavender:  #A29EAF;
    --orb-red:   #C0532F;   /* rationed punctuation */

    /* semantic tier — roles */
    --bg:     var(--ink);
    --fg:     var(--sand);
    --muted:  var(--ink-soft);
    --accent: var(--orb-red);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.02em; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  #status { position: fixed; left: 22px; top: 20px; z-index: 10; color: var(--muted);
    white-space: pre; pointer-events: none; max-height: 90vh; overflow: hidden; }

  /* Fallback card (§4) — shown when WebGPU is unavailable or the device is
     lost twice. Palette-only; Jean supplies the final visual + copy. */
  #fallback { display: none; position: fixed; inset: 0; z-index: 20;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px; background: var(--bg); }
  #fallback .plate { max-width: 560px; }
  #fallback h1 { font-weight: normal; letter-spacing: 0.08em; color: var(--fg);
    font-size: 20px; margin: 0 0 14px; }
  /* JEAN: drop the gallery still here (an <img>, or a static painting). */
  #fallback .art { width: 220px; height: 220px; margin: 0 auto 22px;
    border: 1px solid var(--muted); border-radius: 0;
    background:
      radial-gradient(circle at 38% 34%, var(--gold) 0 8%, transparent 9%),
      linear-gradient(150deg, var(--sky) 0%, var(--olive) 55%, var(--coral) 100%); }
  #fallback p { color: var(--muted); line-height: 1.7; margin: 0 0 10px; }
  #fallback .note { color: var(--accent); letter-spacing: 0.06em; }
  #fallback-reason { color: var(--ink-soft); font-size: 11px; margin-top: 20px;
    white-space: pre-line; opacity: 0.7; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="status">booting…</div>
  <div id="fallback">
    <div class="plate">
      <div class="art" role="img" aria-label="The Ever Expanding Board"></div>
      <h1>The Ever Expanding Board</h1>
      <p>This piece renders live with WebGPU.</p>
      <p class="note">Best experienced in Chrome or Edge on a desktop.</p>
      <div id="fallback-reason"></div>
    </div>
  </div>
  <script type="module" src="./js/boot.js"></script>
</body>
</html>
